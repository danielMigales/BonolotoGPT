name: Validar y publicar BonolotoGPT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bonoloto-manual-pages
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Validar datos manuales (sin consultar SELAE)
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path

          path = Path("public/data/draws.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          draws = payload.get("draws")
          if not isinstance(draws, list) or len(draws) > 10:
              raise SystemExit("ERROR: debe haber como máximo 10 sorteos.")
          dates = []
          for draw in draws:
              try:
                  date.fromisoformat(draw["date"])
              except (KeyError, TypeError, ValueError):
                  raise SystemExit("ERROR: fecha ausente o inválida.")
              numbers = draw.get("numbers")
              if not isinstance(numbers, list) or len(numbers) != 6 or any(type(n) is not int or n < 1 or n > 49 for n in numbers) or len(set(numbers)) != 6:
                  raise SystemExit("ERROR: cada sorteo necesita seis números únicos entre 1 y 49.")
              complementary = draw.get("complementario")
              refund = draw.get("reintegro")
              if type(complementary) is not int or not 1 <= complementary <= 49 or complementary in numbers:
                  raise SystemExit("ERROR: complementario inválido.")
              if type(refund) is not int or not 0 <= refund <= 9:
                  raise SystemExit("ERROR: reintegro inválido.")
              source = draw.get("source")
              if source is not None and (not isinstance(source, str) or not source.startswith("https://")):
                  raise SystemExit("ERROR: la referencia debe ser una URL HTTPS.")
              dates.append(draw["date"])
          if len(set(dates)) != len(dates):
              raise SystemExit("ERROR: hay fechas duplicadas.")
          if dates != sorted(dates, reverse=True):
              raise SystemExit("ERROR: los sorteos deben estar ordenados del más reciente al más antiguo.")
          print(f"Validación correcta: {len(draws)} sorteos manuales; no se consultó SELAE.")
          PY
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir web estática
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar web
        id: deployment
        uses: actions/deploy-pages@v4
