name: Publicar BonolotoGPT

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bonoloto-manual-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Validar los diez sorteos guardados (sin consultar SELAE)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("public/data/draws.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          draws = data.get("draws")
          if not isinstance(draws, list) or len(draws) != 10:
              raise SystemExit("ERROR: deben existir exactamente 10 sorteos.")
          dates = set()
          for d in draws:
              nums = d.get("numbers")
              if not isinstance(nums, list) or len(nums) != 6 or len(set(nums)) != 6:
                  raise SystemExit("ERROR: un sorteo no contiene seis números únicos.")
              if any(not isinstance(n, int) or n < 1 or n > 49 for n in nums):
                  raise SystemExit("ERROR: número principal fuera del rango 1-49.")
              if not d.get("date") or not d.get("source"):
                  raise SystemExit("ERROR: falta fecha o referencia de fuente.")
              dates.add(d["date"])
          if len(dates) != 10:
              raise SystemExit("ERROR: las fechas de los sorteos deben ser únicas.")
          print("Validación correcta: 10 sorteos, seis números únicos por sorteo.")
          PY
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir web estática
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar web
        id: deployment
        uses: actions/deploy-pages@v4
