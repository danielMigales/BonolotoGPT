name: Publicar BonolotoGPT en GitHub Pages
on:
  schedule:
    - cron: '7 23 * * *'
      timezone: 'Europe/Madrid'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Descargar y validar el histórico oficial de BonoLoto
        id: update-data
        run: npm run update-data
      - name: Guardar el histórico validado
        if: steps.update-data.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draws.json
          if ! git diff --cached --quiet; then
            git commit -m "Guardar histórico oficial validado de BonoLoto [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              git rebase --abort || true
              sleep 2
            done
            echo "No se pudo guardar el histórico tras tres intentos por cambios concurrentes."
            exit 1
          fi
      - name: Guardar el punto de control si falla SELAE
        if: always() && steps.update-data.outcome == 'failure'
        run: |
          if [ -f data/draws-progress.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/draws-progress.json
            if ! git diff --cached --quiet; then
              git commit -m "Guardar progreso de descarga Bonoloto"
              for attempt in 1 2 3; do
                git pull --rebase -X theirs origin main && git push && exit 0
                git rebase --abort || true
                sleep 2
              done
              echo "No se pudo guardar el punto de control tras tres intentos."
              exit 1
            fi
          fi
      - name: Construir la web y el informe
        run: npm run build
      - name: Ejecutar las pruebas
        run: npm test
      - name: Guardar artefactos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar histórico y artefactos de BonoLoto [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              git rebase --abort || true
              sleep 2
            done
            echo "No se pudieron publicar los artefactos tras tres intentos por cambios concurrentes."
            exit 1
          fi
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Preparar archivos públicos
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Publicar BonolotoGPT
        id: deployment
        uses: actions/deploy-pages@v5
