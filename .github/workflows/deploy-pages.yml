name: Publicar BonolotoGPT en GitHub Pages
on:
  schedule:
    # 23:07 hora de Madrid. Se evita el minuto 00 y no se descartan ejecuciones si GitHub las retrasa.
    - cron: '7 23 * * *'
      timezone: 'Europe/Madrid'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  # Comparte grupo con la validación para evitar ejecuciones concurrentes que escriban en main.
  group: bonoloto-main-pipeline
  cancel-in-progress: false
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Descargar y validar el histórico oficial de BonoLoto
        id: update-data
        run: npm run update-data
      - name: Contrastar y archivar la predicción que acaba de resolverse
        if: steps.update-data.outcome == 'success'
        run: python scripts/archive_forecast.py
      - name: Guardar el histórico y la evaluación antes de construir y probar
        if: steps.update-data.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draws.json data/forecast-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Guardar histórico oficial validado de BonoLoto [skip ci]"
            git push
          fi
      - name: Guardar el punto de control si falla SELAE
        if: always() && steps.update-data.outcome == 'failure'
        run: |
          if [ -f data/draws-progress.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/draws-progress.json
            if ! git diff --cached --quiet; then
              git commit -m "Guardar progreso de descarga Bonoloto"
              git push
            fi
          fi
      - name: Detener la ejecución si falla la actualización del histórico
        if: steps.update-data.outcome == 'failure'
        run: |
          echo "::error::No se publicará la web porque falló la descarga o validación del histórico de Bonoloto."
          exit 1
      - name: Construir, registrar la predicción futura y regenerar el informe
        run: |
          npm run build
          python scripts/record_forecast.py
          npm run build
      - name: Ejecutar las pruebas
        run: npm test
      - name: Guardar el histórico oficial y los artefactos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar histórico oficial de BonoLoto [skip ci]"
            git push
          fi
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Preparar archivos públicos
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Publicar BonolotoGPT
        id: deployment
        uses: actions/deploy-pages@v5
