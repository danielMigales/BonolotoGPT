name: Publicar BonolotoGPT en GitHub Pages
on:
  schedule:
    # Se comprueban ambas horas UTC para ejecutar a las 23:00 de Madrid en invierno y verano.
    - cron: '0 21 * * *'
    - cron: '0 22 * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que son las 23:00 en España
        id: schedule-time
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$(TZ=Europe/Madrid date +%H)" = "23" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Obtener código
        if: steps.schedule-time.outputs.run == 'true'
        uses: actions/checkout@v7
      - name: Configurar Python
        if: steps.schedule-time.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Configurar Node.js
        if: steps.schedule-time.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Descargar y validar el histórico oficial de BonoLoto
        id: update-data
        if: steps.schedule-time.outputs.run == 'true'
        run: npm run update-data
      - name: Contrastar y archivar la predicción que acaba de resolverse
        if: steps.schedule-time.outputs.run == 'true' && steps.update-data.outcome == 'success'
        run: python scripts/archive_forecast.py
      - name: Guardar el histórico y la evaluación antes de construir y probar
        if: steps.schedule-time.outputs.run == 'true' && steps.update-data.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draws.json data/forecast-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Guardar histórico oficial validado de BonoLoto [skip ci]"
            git push
          fi
      - name: Guardar el punto de control si falla SELAE
        if: always() && steps.schedule-time.outputs.run == 'true' && steps.update-data.outcome == 'failure'
        run: |
          if [ -f data/draws-progress.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/draws-progress.json
            if ! git diff --cached --quiet; then
              git commit -m "Guardar progreso de descarga Bonoloto"
              git push
            fi
          fi
      - name: Construir, registrar la predicción futura y regenerar el informe
        if: steps.schedule-time.outputs.run == 'true'
        run: |
          npm run build
          python scripts/record_forecast.py
          npm run build
      - name: Ejecutar las pruebas
        if: steps.schedule-time.outputs.run == 'true'
        run: npm test
      - name: Guardar el histórico oficial y los artefactos generados
        if: steps.schedule-time.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar histórico oficial de BonoLoto [skip ci]"
            git push
          fi
      - name: Configurar GitHub Pages
        if: steps.schedule-time.outputs.run == 'true'
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Preparar archivos públicos
        if: steps.schedule-time.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Publicar BonolotoGPT
        if: steps.schedule-time.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
