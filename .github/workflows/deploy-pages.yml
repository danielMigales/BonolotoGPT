name: Publicar BonolotoGPT en GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    # 22:15 UTC: después de las 23:00 en horario peninsular de invierno.
    # En verano se ejecuta a las 00:15 CEST, también después del sorteo.
    - cron: '15 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Actualizar histórico completo de Bonoloto
        run: npm run update-data
      - name: Construir la web y el informe
        run: npm run build
      - name: Ejecutar las pruebas
        run: npm test
      - name: Guardar artefactos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar histórico y artefactos de BonoLoto [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              git rebase --abort || true
              sleep 2
            done
            echo "No se pudieron publicar los artefactos tras tres intentos por cambios concurrentes."
            exit 1
          fi
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Preparar archivos públicos
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Publicar BonolotoGPT
        id: deployment
        uses: actions/deploy-pages@v5
