name: Publicar BonolotoGPT en GitHub Pages
on:
  schedule:
    # GitHub Actions usa UTC: 20:00 UTC equivale a las 22:00 en España peninsular durante el horario de verano.
    - cron: '0 20 * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Descargar y validar el histórico oficial de BonoLoto
        run: npm run update-data
      - name: Construir la aplicación con el histórico oficial
        run: npm run build
      - name: Ejecutar las pruebas
        run: npm test
      - name: Guardar el histórico oficial y los artefactos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar histórico oficial de BonoLoto"
            git push
          fi
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Preparar archivos públicos
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Publicar BonolotoGPT
        id: deployment
        uses: actions/deploy-pages@v5
