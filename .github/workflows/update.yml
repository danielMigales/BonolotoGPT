name: Validar BonolotoGPT
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: bonoloto-publicacion
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Probar y generar aplicación
        run: |
          npm test
          npm run build
      - name: Comprobar que la generación del Worker es reproducible
        run: |
          before="$(sha256sum worker/index.js | cut -d ' ' -f1)"
          npm run build
          after="$(sha256sum worker/index.js | cut -d ' ' -f1)"
          if [ "$before" != "$after" ]; then
            echo "El Worker cambia entre dos compilaciones consecutivas."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bonoloto-web-estatica
          path: public
