name: Validar BonolotoGPT
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Mismo grupo que la publicación: evita carreras entre pruebas y actualizaciones del histórico.
  group: bonoloto-main-pipeline
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Probar y generar aplicación
        run: |
          npm test
          npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: bonoloto-web-estatica
          path: public
