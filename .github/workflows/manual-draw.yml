name: Guardar sorteo manual de Bonoloto
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      resultado:
        description: 'Formato: Fecha: AAAA-MM-DD; Números: 1,2,3,4,5,6; Complementario: 7; Reintegro: 8'
        required: true
        type: string
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
jobs:
  save-draw:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == 'danielMigales' && startsWith(github.event.issue.title, '[SORTEO MANUAL BONOLOTO]'))
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validar y guardar el sorteo
        id: save
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_RESULTADO: ${{ inputs.resultado }}
        run: python scripts/import_manual_draw.py
      - name: Marcar como fallida una entrada inválida
        if: github.event_name == 'workflow_dispatch' && steps.save.outputs.status != 'success'
        run: |
          echo "No se ha guardado el sorteo: ${{ steps.save.outputs.message }}"
          exit 1
      - name: Publicar el histórico actualizado
        if: steps.save.outputs.status == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draws.json
          if ! git diff --cached --quiet; then
            git commit -m "Guardar sorteo manual de Bonoloto"
            git push
          fi
      - name: Configurar Node.js
        if: steps.save.outputs.status == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Instalar dependencias y construir la web
        if: steps.save.outputs.status == 'success'
        run: |
          npm ci
          npm run build
      - name: Configurar GitHub Pages
        if: steps.save.outputs.status == 'success'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar archivos públicos
        if: steps.save.outputs.status == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar web actualizada
        if: steps.save.outputs.status == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirmar resultado en GitHub
        uses: actions/github-script@v8
        if: always() && github.event_name == 'issues'
        env:
          SAVE_STATUS: ${{ steps.save.outputs.status }}
          SAVE_MESSAGE: ${{ steps.save.outputs.message }}
        with:
          script: |
            const status = process.env.SAVE_STATUS || 'error';
            const message = process.env.SAVE_MESSAGE || 'No se pudo procesar el sorteo. Revisa la fecha y los campos del formulario.';
            const prefix = status === 'success' ? 'Sorteo guardado' : 'No se ha guardado el sorteo';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `**${prefix}**\n\n${message}${status === 'success' ? '\n\nEl sorteo se ha guardado y la publicación de la web se ha completado.' : ''}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
