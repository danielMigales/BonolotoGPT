<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102a43">
<title>BonolotoGPT · 10 últimos sorteos</title>
<style>
:root{color-scheme:light;--ink:#172b3a;--muted:#6b7b88;--line:#e1e7ed;--paper:#f5f7fa;--blue:#e8f1f8;--blue-ink:#17466b;--red:#bd2026;--red-bg:#fff0f0}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:12px 12px 8px;text-align:center}h1{font-size:1.2rem;line-height:1.2;margin:0;font-weight:800;letter-spacing:.01em}
main{width:min(100%,650px);margin:0 auto;padding:4px 8px 18px}
#status{font-size:.76rem;color:var(--muted);padding:4px 3px 8px;text-align:center}
.draws{display:grid;gap:5px}
.draw{display:grid;grid-template-columns:68px minmax(0,1fr);align-items:center;column-gap:7px;padding:7px 7px;background:#fff;border:1px solid var(--line);border-radius:10px;min-width:0}
.meta{min-width:0}.date{font-size:.73rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.extras{font-size:.61rem;color:var(--muted);line-height:1.4;margin-top:4px;white-space:nowrap}
.numbers{display:flex;align-items:center;justify-content:space-between;gap:3px;min-width:0}
.ball{position:relative;display:inline-flex;align-items:center;justify-content:center;width:clamp(27px,7.2vw,36px);height:clamp(27px,7.2vw,36px);border-radius:50%;flex:0 1 36px;min-width:0;background:var(--blue);color:var(--blue-ink);font-weight:800;font-size:clamp(.69rem,2.7vw,.86rem);font-variant-numeric:tabular-nums;border:1px solid #d6e4ef}
.ball.repeat{background:var(--red-bg);color:var(--red);border:1.5px solid var(--red)}
.ball.repeat:after{content:"";position:absolute;width:6px;height:6px;right:-1px;top:-1px;border-radius:50%;background:var(--red);border:1px solid white}
@media(min-width:520px){header{padding-top:16px}h1{font-size:1.35rem}main{padding-top:7px}.draw{grid-template-columns:84px minmax(0,1fr);padding:8px 12px}.date{font-size:.8rem}.extras{font-size:.68rem}.draws{gap:6px}}
</style>
</head>
<body>
<header><h1>BonolotoGPT · Últimos 10 sorteos</h1></header>
<main>
<div id="status" role="status">Cargando…</div>
<div id="draws" class="draws"></div>
</main>
<script>
(async()=>{
 const status=document.getElementById('status'),list=document.getElementById('draws');
 const fmtDate=s=>{const [y,m,d]=s.split('-');return d+'/'+m+'/'+y};
 const ball=(n,repeat)=>{const el=document.createElement('span');el.className='ball'+(repeat?' repeat':'');el.textContent=String(n).padStart(2,'0');return el};
 try{
  const response=await fetch('data/draws.json',{cache:'no-store'});
  if(!response.ok)throw new Error('No se pueden leer los sorteos.');
  const payload=await response.json(),draws=payload.draws;
  if(!Array.isArray(draws)||draws.length!==10)throw new Error('Deben estar cargados exactamente 10 sorteos.');
  const counts=new Map();
  for(const d of draws)for(const n of d.numbers)counts.set(n,(counts.get(n)||0)+1);
  const repeated=new Set([...counts].filter(([,count])=>count>1).map(([n])=>n));
  draws.forEach(d=>{
   const card=document.createElement('article');card.className='draw';
   const meta=document.createElement('div');meta.className='meta';
   const date=document.createElement('div');date.className='date';date.textContent=fmtDate(d.date);
   const extras=document.createElement('div');extras.className='extras';extras.textContent='C: '+String(d.complementario).padStart(2,'0')+' · R: '+d.reintegro;
   meta.append(date,extras);
   const nums=document.createElement('div');nums.className='numbers';
   d.numbers.forEach(n=>nums.appendChild(ball(n,repeated.has(n))));
   card.append(meta,nums);list.appendChild(card);
  });
  status.remove();
 }catch(error){status.textContent='No se pueden mostrar los sorteos: '+error.message}
})();
</script>
</body></html>
